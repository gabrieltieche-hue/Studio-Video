name: CI

on:
  push:
    branches: [main, production-hardening]
  pull_request:
    branches: [main]

jobs:
  build-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install system media dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium for motion-capture tests
        run: npx playwright install --with-deps chromium
      - name: Validate tablet launcher syntax
        run: bash -n scripts/start-studio-online.sh
      - name: Run media integration tests
        run: npm test
      - name: TypeScript check
        run: npm run lint
      - name: Vite production build
        run: npm run build
